<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Zinhle Debt Counsellors</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f1c; --card:#131c31; --card-hover:#1a2740; --card-light:#ffffff;
    --text:#f1f5f9; --text-dark:#0f172a; --muted:#94a3b8; --accent:#00d4aa;
    --accent-dark:#00b894; --danger:#ef4444; --warning:#f59e0b;
    --border:rgba(255,255,255,0.05); --border-light:#e2e8f0;
  }
  [data-theme="light"]{
    --bg:#f8fafc; --card:#ffffff; --card-hover:#f1f5f9; --text:#0f172a;
    --text-light:#0f172a; --muted:#64748b; --border:#e2e8f0;
  }

  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif;}
  body{background:var(--bg);color:var(--text);transition:all 0.4s;}

  @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}

.page{display:none;min-height:100vh;padding-bottom:100px;animation:fadeIn 0.4s ease-out;}
.page.active{display:block;}

.auth-container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#1e293b,#0f172a);}
.auth-card{background:var(--card);padding:32px;border-radius:24px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.3);border:1px solid var(--border);}
.auth-card h2{font-size:28px;font-weight:800;margin-bottom:8px;}
.auth-card p{color:var(--muted);margin-bottom:24px;}

input,select,button{width:100%;padding:14px;margin:10px 0;border:1px solid var(--border-light);border-radius:12px;background:var(--bg);color:var(--text);font-size:15px;}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,170,0.2);}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:white;border:none;font-weight:600;cursor:pointer;}

.hero{position:relative;height:58vh;background:linear-gradient(135deg,#1e293b,#0f172a) center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:24px;}
.hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.2) 0%,rgba(10,15,28,0.95) 75%);}
.hero-content{position:relative;z-index:2;}
.hero-content h1{font-size:34px;font-weight:800;margin:4px 0 24px;}

.score-ring{width:260px;height:260px;margin:0 auto;position:relative;display:flex;align-items:center;justify-content:center;}
.score-ring svg{transform:rotate(-90deg);position:absolute;}
.score-content{text-align:center;background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);width:220px;height:220px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.15);}
.score-content h2{font-size:64px;font-weight:800;}
.score-btn{margin-top:12px;padding:10px 22px;background:var(--accent);color:white;border:none;border-radius:30px;font-weight:600;cursor:pointer;}

.curve{height:40px;background:var(--bg);border-radius:40px 40px 0 0;margin-top:-40px;}
.container{padding:0 20px;}
.section-title{font-size:24px;font-weight:700;margin:20px 0 16px;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.card{background:var(--card);border-radius:20px;padding:20px;cursor:pointer;border:1px solid var(--border);}
.card:hover{background:var(--card-hover);transform:translateY(-4px);}
.card-icon{width:40px;height:40px;background:rgba(0,212,170,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
.card h4{font-size:16px;font-weight:600;}
.card p{font-size:13px;color:var(--muted);}

.page-content{background:var(--card-light);min-height:100vh;padding:20px;padding-bottom:100px;color:var(--text-dark);}
[data-theme="dark"].page-content{background:var(--card);color:var(--text);}
.page-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.back-btn{width:40px;height:40px;border-radius:12px;background:#f1f5f9;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;}

.stat{background:#f8fafc;padding:16px;border-radius:16px;margin-bottom:12px;}
[data-theme="dark"].stat{background:#1e293b;}
.stat h4{font-size:13px;color:var(--muted);text-transform:uppercase;}
.stat p{font-size:24px;font-weight:700;margin-top:4px;}

table{width:100%;border-collapse:collapse;margin-top:16px;font-size:14px;}
th,td{border-bottom:1px solid var(--border-light);padding:14px;text-align:left;}
th{background:rgba(0,212,170,0.1);color:var(--accent);font-weight:600;}

.notification{position:fixed;top:20px;right:20px;background:var(--card);padding:16px 20px;border-radius:12px;border-left:4px solid var(--accent);box-shadow:0 8px 30px rgba(0,0,0,0.3);z-index:1000;display:none;}
.notification.show{display:block;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card-light);display:flex;justify-content:space-around;padding:12px 0;border-radius:24px 24px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,0.1);z-index:100;}
[data-theme="dark"].bottom-nav{background:var(--card);}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);cursor:pointer;}
.nav-item.active{color:var(--accent);}

.help-btn{position:fixed;bottom:90px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--bg);color:white;border:none;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;z-index:99;}

.top-bar{position:absolute;top:20px;right:20px;z-index:10;display:flex;gap:8px;}
.toggle-btn{padding:8px 12px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:12px;border:1px solid rgba(255,255,255,0.2);color:white;font-weight:600;cursor:pointer;}
</style>
</head>
<body data-theme="dark">

<div class="notification" id="notification"></div>

<!-- AUTH PAGE -->
<div id="auth" class="page active">
  <div class="auth-container">
    <div class="auth-card">
      <h2>Welcome to Zinhle</h2>
      <p>Login or create an account to manage your debt review</p>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <select id="role">
        <option value="client">Client</option>
        <option value="admin">Admin</option>
      </select>
      <label style="display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;">
        <input type="checkbox" id="popia" style="width:auto;"> I consent to POPIA data processing
      </label>
      <button class="primary" onclick="login()">Continue</button>
    </div>
  </div>
</div>

<!-- HOME PAGE -->
<div id="home" class="page">
  <div class="hero">
    <div class="top-bar">
      <button class="toggle-btn" onclick="toggleTheme()">🌙/☀️</button>
      <button class="toggle-btn" onclick="logout()">Logout</button>
    </div>
    <div class="hero-content">
      <h3 id="greeting">Good afternoon</h3>
      <h1 id="username">Zinhle Debt Counsellors</h1>
      <div class="score-ring">
        <svg width="260" height="260">
          <circle cx="130" cy="130" r="120" stroke="rgba(255,255,255,0.15)" stroke-width="12" fill="none"/>
          <circle id="scoreCircle" cx="130" cy="130" r="120" stroke="#00d4aa" stroke-width="12" fill="none"
                  stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="754"/>
        </svg>
        <div class="score-content">
          <small>Debt Health Score</small>
          <h2 id="score">638</h2>
          <button class="score-btn" onclick="showPage('report')">+ View Report</button>
        </div>
      </div>
    </div>
  </div>
  <div class="curve"></div>
  <div class="container">
    <h2 class="section-title">Explore</h2>
    <div class="grid">
      <div class="card" onclick="showPage('report')"><div class="card-icon">📊</div><h4>Debt Report</h4><p>See your full breakdown</p></div>
      <div class="card" onclick="showPage('debts')"><div class="card-icon">💳</div><h4>My Debts</h4><p>Manage accounts</p></div>
    </div>
  </div>
</div>

<!-- REPORT PAGE -->
<div id="report" class="page">
  <div class="page-content">
    <div class="page-header"><button class="back-btn" onclick="showPage('home')">←</button><h2>Debt Report</h2></div>
    <div id="reportContent"></div>
    <button class="primary" onclick="exportPDF()">📄 Export PDF</button>
  </div>
</div>

<!-- DEBTS PAGE -->
<div id="debts" class="page">
  <div class="page-content">
    <div class="page-header"><button class="back-btn" onclick="showPage('home')">←</button><h2>My Debts</h2></div>
    <input type="text" id="creditor" placeholder="Creditor Name">
    <input type="number" id="amount" placeholder="Outstanding Amount">
    <input type="number" id="installment" placeholder="Monthly Installment">
    <input type="number" id="interest" placeholder="Interest Rate %">
    <button class="primary" onclick="addDebt()">Add Debt</button>
    <h3 style="margin-top:24px;">Current Debts</h3>
    <div id="debtList"></div>
  </div>
</div>

<!-- HELP BUTTON -->
<button class="help-btn" onclick="openWhatsApp()">?</button>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottomNav" style="display:none;">
  <div class="nav-item active" onclick="showPage('home')">Home</div>
  <div class="nav-item" onclick="showPage('report')">Report</div>
  <div class="nav-item" onclick="showPage('debts')">Debts</div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users') || '{}');
let currentUser = null;

function showNotification(msg,type='info'){
  const notif = document.getElementById('notification');
  notif.textContent = msg;
  notif.style.borderLeftColor = type==='success'?'var(--accent-dark)':type==='error'?'var(--danger)':'var(--accent)';
  notif.classList.add('show');
  setTimeout(()=>notif.classList.remove('show'),3000);
}

function toggleTheme(){
  const theme = document.body.dataset.theme === 'dark'? 'light' : 'dark';
  document.body.dataset.theme = theme;
}

function login(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const popia = document.getElementById('popia').checked;

  if(!email ||!password){showNotification('Enter email and password','error');return;}
  if(!popia){showNotification('Please accept POPIA consent','error');return;}

  if(!users[email]){
    users[email] = {
      password,
      role: document.getElementById('role').value,
      debts:[], status:'Pending'
    };
  }

  if(users[email].password!== password){
    showNotification('Wrong password','error');
    return;
  }

  currentUser = email;
  localStorage.setItem('users', JSON.stringify(users));

  document.getElementById('auth').classList.remove('active');
  document.getElementById('bottomNav').style.display='flex';

  showPage('home', true);
  updateGreeting();
  updateScore();
  loadDebtList();
  showNotification('Welcome back!','success');
}

function logout(){
  currentUser = null;
  document.getElementById('auth').classList.add('active');
  document.getElementById('bottomNav').style.display='none';
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('auth').classList.add('active');
}

function updateGreeting(){
  if(!currentUser) return;
  const hour = new Date().getHours();
  const greet = hour < 12? 'Good morning' : hour < 18? 'Good afternoon' : 'Good evening';
  const greetingEl = document.getElementById('greeting');
  const usernameEl = document.getElementById('username');
  if(greetingEl) greetingEl.textContent = greet;
  if(usernameEl) usernameEl.textContent = currentUser.split('@')[0];
}

function updateScore(){
  if(!currentUser) return;
  const debts = users[currentUser]?.debts || [];
  const total = debts.reduce((a,b)=>a+b.amount,0);
  const score = Math.max(300, 850 - Math.floor(total/800));
  const scoreEl = document.getElementById('score');
  const circleEl = document.getElementById('scoreCircle');
  if(scoreEl) scoreEl.textContent = score;
  if(circleEl){
    const offset = 754 - (score-300)/550*754;
    circleEl.style.strokeDashoffset = offset;
  }
}

function showPage(page, skipNavUpdate = false){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const targetPage = document.getElementById(page);
  if(targetPage) targetPage.classList.add('active');

  if(!skipNavUpdate){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    const idx = getNavIndex(page);
    const navItems = document.querySelectorAll('.nav-item');
    if(navItems[idx]) navItems[idx].classList.add('active');
  }

  if(page==='report')loadReport();
  if(page==='debts')loadDebtList();
}

function getNavIndex(page){
  const map = {home:0, report:1, debts:2};
  return map[page]?? 0;
}

function addDebt(){
  const creditor = document.getElementById('creditor').value;
  const amount = parseFloat(document.getElementById('amount').value)||0;
  const installment = parseFloat(document.getElementById('installment').value)||0;
  const interest = parseFloat(document.getElementById('interest').value)||0;

  if(!creditor ||!amount){showNotification('Please fill creditor and amount','error');return;}
  users[currentUser].debts.push({creditor, amount, installment, interest});
  localStorage.setItem('users', JSON.stringify(users));

  document.getElementById('creditor').value='';
  document.getElementById('amount').value='';
  document.getElementById('installment').value='';
  document.getElementById('interest').value='';

  updateScore();
  loadDebtList();
  showNotification('Debt added successfully','success');
}

function loadDebtList(){
  const debts = users[currentUser]?.debts || [];
  const list = document.getElementById('debtList');
  if(!list) return;
  if(debts.length===0){
    list.innerHTML='<p style="color:#64748b;text-align:center;padding:20px;">No debts added yet</p>';
    return;
  }

  list.innerHTML = debts.map((d,i)=>`
    <div class="stat">
      <h4>${d.creditor}</h4>
      <p>R${d.amount.toLocaleString()} - R${d.installment}/month at ${d.interest}%</p>
      <button onclick="deleteDebt(${i})" style="margin-top:8px;padding:6px 12px;background:#fee2e2;color:#dc2626;border:none;border-radius:8px;">Delete</button>
    </div>
  `).join('');
}

function deleteDebt(i){
  users[currentUser].debts.splice(i,1);
  localStorage.setItem('users', JSON.stringify(users));
  updateScore();
  loadDebtList();
  showNotification('Debt removed','success');
}

function loadReport(){
  const debts = users[currentUser]?.debts || [];
  const total = debts.reduce((a,b)=>a+b.amount,0);
  const monthly = debts.reduce((a,b)=>a+b.installment,0);
  const newMonthly = monthly*0.6;

  const reportContent = document.getElementById('reportContent');
  if(!reportContent) return;

  reportContent.innerHTML = `
    <div class="stat">
      <h4>Total Debt</h4>
      <p>R${total.toLocaleString()}</p>
    </div>
    <div class="stat">
      <h4>Current Monthly Payments</h4>
      <p>R${monthly.toLocaleString()}</p>
    </div>
    <div class="stat" style="background:rgba(0,212,170,0.1);border:1px solid rgba(0,212,170,0.2);">
      <h4>Estimated Under Debt Review</h4>
      <p style="color:var(--accent-dark);">R${newMonthly.toLocaleString()}</p>
      <p style="font-size:14px;color:var(--accent-dark);">Potential savings: R${(monthly-newMonthly).toLocaleString()}/month</p>
    </div>
  `;
}

function exportPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const debts = users[currentUser]?.debts || [];
  const total = debts.reduce((a,b)=>a+b.amount,0);
  const monthly = debts.reduce((a,b)=>a+b.installment,0);

  doc.text('Zinhle Debt Counsellors', 20, 20);
  doc.text(`Client: ${currentUser}`, 20, 40);
  doc.text(`Total Debt: R${total.toLocaleString()}`, 20, 50);
  doc.text(`Monthly Payments: R${monthly.toLocaleString()}`, 20, 60);
  doc.save('zinhle-debt-report.pdf');
  showNotification('PDF downloaded','success');
}

function openWhatsApp(){
  window.open('https://wa.me/27739308383?text=Hi%20Zinhle%20Debt%20Counsellors', '_blank');
}

// Don't call updateGreeting/updateScore on load - wait for login
</script>
</body>
</html>
